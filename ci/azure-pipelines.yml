trigger:
  branches: { include: [main, release/*] }

variables:
  imageRepo: telecom-plans
  acrConnection: acr-service-connection
  version: '1.4.0-$(Build.BuildId)'

stages:
  - stage: Build
    jobs:
      - job: BuildTestPush
        pool: { vmImage: ubuntu-latest }
        steps:
          - task: Maven@4
            inputs:
              mavenPomFile: pom.xml
              goals: verify
              options: '-B -Drevision=$(version)'
              javaHomeOption: JDKVersion
              jdkVersionOption: '1.17'
              publishJUnitResults: true
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
          - task: Docker@2
            inputs:
              containerRegistry: $(acrConnection)
              repository: $(imageRepo)
              command: buildAndPush
              Dockerfile: Dockerfile
              arguments: '--build-arg APP_VERSION=$(version)'
              tags: $(version)
          - publish: k8s
            artifact: manifests

  - stage: DeployQA
    dependsOn: Build
    jobs:
      - deployment: QA
        environment: telecom-qa          # environments can have approvals & checks
        strategy:
          runOnce:
            deploy:
              steps:
                - template: deploy-steps.yml
                  parameters: { env: qa }

  - stage: DeployStaging
    dependsOn: DeployQA
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: Staging
        environment: telecom-staging
        strategy:
          runOnce:
            deploy:
              steps:
                - template: deploy-steps.yml
                  parameters: { env: staging }

  - stage: DeployProd
    dependsOn: DeployStaging
    jobs:
      - deployment: Prod
        environment: telecom-prod        # configure manual approval on this environment
        strategy:
          runOnce:
            deploy:
              steps:
                - template: deploy-steps.yml
                  parameters: { env: prod }
            on:
              failure:
                steps:
                  - script: kubectl -n telecom-prod rollout undo deployment/telecom-plans
