# Local "prod-like" stack: same image, Postgres + Redis, staging profile without an IdP.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: plans
      POSTGRES_USER: plans
      POSTGRES_PASSWORD: plans
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plans"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  app:
    build: .
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    environment:
      SPRING_PROFILES_ACTIVE: qa
      DB_URL: jdbc:postgresql://postgres:5432/plans
      DB_USERNAME: plans
      DB_PASSWORD: plans
      API_PASSWORD: qa123
      BILLING_URL: http://localhost:9999
    ports: ["8080:8080"]
