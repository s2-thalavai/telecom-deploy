apiVersion: apps/v1
kind: Deployment
metadata:
  name: telecom-plans
  labels: { app: telecom-plans }
spec:
  replicas: 2
  revisionHistoryLimit: 10                 # keeps old ReplicaSets for `kubectl rollout undo`
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0                    # zero-downtime
  selector:
    matchLabels: { app: telecom-plans }
  template:
    metadata:
      labels: { app: telecom-plans }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "9091"
    spec:
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
      containers:
        - name: app
          image: telecom-plans:latest      # overridden per overlay with immutable tag
          ports:
            - { name: http, containerPort: 8080 }
            - { name: management, containerPort: 9091 }
          envFrom:
            - configMapRef: { name: telecom-plans-config }
            - secretRef: { name: telecom-plans-secrets }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits:   { cpu: "1",  memory: 1Gi }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: management }
            periodSeconds: 5
          lifecycle:
            preStop:
              exec: { command: ["sh", "-c", "sleep 10"] }   # let LB drain before shutdown
