# Pulls secrets from a cloud vault into the K8s Secret (External Secrets Operator).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: telecom-plans-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: cloud-vault                     # azure-keyvault / aws-secrets-manager / gcp-sm
  target:
    name: telecom-plans-secrets
  dataFrom:
    - extract:
        key: telecom-plans                # one JSON secret per environment, e.g. prod/telecom-plans
