apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: telecom-plans
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: telecom-plans }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
