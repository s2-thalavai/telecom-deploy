apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: telecom-plans
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: plans.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: telecom-plans, port: { name: http } }
