apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: telecom-qa
resources:
  - ../../base
images:
  - name: telecom-plans
    newName: myregistry.azurecr.io/telecom-plans
    newTag: "1.0.0-local"            # CI rewrites: kustomize edit set image telecom-plans=...:<version>-<sha>
replicas:
  - name: telecom-plans
    count: 2
configMapGenerator:
  - name: telecom-plans-config
    behavior: merge
    literals:
      - SPRING_PROFILES_ACTIVE=qa
patches:
  - target: { kind: HorizontalPodAutoscaler, name: telecom-plans }
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 3
  - target: { kind: Ingress, name: telecom-plans }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: plans-qa.example.com
  - target: { kind: ExternalSecret, name: telecom-plans-secrets }
    patch: |-
      - op: replace
        path: /spec/dataFrom/0/extract/key
        value: qa/telecom-plans
