# ============ COMMON settings shared by every environment ============
spring:
  application:
    name: telecom-plans-service
  profiles:
    default: dev                       # used when SPRING_PROFILES_ACTIVE is not set
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate               # Flyway owns the schema in EVERY environment
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    cache-names: plans,planByCode
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8080
  shutdown: graceful                   # finish in-flight requests before stopping (rolling deploys)
  forward-headers-strategy: framework  # correct scheme/host behind load balancers / ingress

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        readiness:
          include: readinessState,db
  info:
    env:
      enabled: true
    java:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${telecom.environment}

info:
  app:
    name: ${spring.application.name}
    version: '@project.version@'

telecom:
  environment: local
  billing:
    enabled: false
    base-url: http://localhost:9999
    timeout: 2s
  features:
    v2-api-enabled: false

resilience4j:
  circuitbreaker:
    instances:
      billing:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20s
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      billing:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException   # don't retry when breaker is open
